<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hind+Siliguri:wght@400;600&family=Tiro+Bangla&display=swap');
  html, body { margin: 0; background: transparent; font-family: "Hind Siliguri", system-ui, sans-serif; color: #EEF0F6; }
  .wrap { height: 360px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .stage { position: relative; display: flex; align-items: center; gap: 18px; }
  svg { overflow: visible; filter: drop-shadow(0 22px 28px rgba(0,0,0,.6)); }
  .stage { animation: fl 6s ease-in-out infinite; } @keyframes fl { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  #num { font-family: "Fraunces", "Tiro Bangla", Georgia, serif; font-size: 46px; font-weight: 600; fill: #F6F1E4; stroke: #0B0F1A; stroke-width: 3px; paint-order: stroke; }
  #band { font-size: 12.5px; fill: #B7BFD3; transition: opacity .2s; }
  .chip { font-family: "Fraunces", "Tiro Bangla", Georgia, serif; font-weight: 600; font-size: 26px; padding: 4px 16px; border-radius: 999px;
    background: linear-gradient(180deg,#FFE08A,#D79A2A); color: #1E2433; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 5px 0 #8A5E12, 0 14px 24px rgba(232,181,74,.35); transform: scale(.8); opacity: 0; transition: transform .35s cubic-bezier(.2,1.4,.4,1), opacity .25s; }
  .chip.show { transform: scale(1); opacity: 1; }
  .chip.neg { background: linear-gradient(180deg,#FF8E8E,#B93A3A); color: #fff; box-shadow: 0 5px 0 #6E1F1F; font-size: 17px; max-width: 170px; text-align: center; line-height: 1.25; }
  .cap { margin-top: 14px; color: #A3ABC0; font-size: 15px; text-align: center; }
  .shimmer { position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(100deg, transparent 35%, rgba(242,207,114,.55) 50%, transparent 65%); background-size: 250% 100%; background-position: 130% 0; }
  .shimmer.go { animation: sw .4s ease-out forwards; }
  @keyframes sw { 0% { opacity: 1; background-position: 130% 0; } 100% { opacity: 0; background-position: -30% 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg id="svg" viewBox="0 0 220 220" width="250" height="250" role="img" aria-label="Before and after understanding score">
      <defs>
        <linearGradient id="fyCoral" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFB27A"/><stop offset=".55" stop-color="#E0703F"/><stop offset="1" stop-color="#B2441C"/></linearGradient>
        <linearGradient id="fyGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".04"/></linearGradient>
        <radialGradient id="fyHalo" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E8B54A" stop-opacity=".35"/><stop offset="1" stop-color="#E8B54A" stop-opacity="0"/></radialGradient>
        <radialGradient id="fyShadow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      <ellipse cx="110" cy="176" rx="92" ry="16" fill="url(#fyShadow)"/><circle cx="110" cy="104" r="104" fill="url(#fyHalo)"/>
      <g transform="translate(0,20) scale(1,0.82)"><g id="sides"></g><g id="segs"></g></g>
      <text id="num" x="110" y="108" text-anchor="middle">{{BEFORE_TXT}}</text>
      <text id="band" x="110" y="128" text-anchor="middle">{{BAND_BEFORE}}</text>
    </svg>
    <div id="chip" class="chip">{{DELTA}}</div>
    <div class="shimmer" id="shim"></div>
  </div>
  <div class="cap">{{CAPTION}}</div>
</div>
<script>
(function () {
  var SEG = {{SEGMENTS_JSON}};
  var BEFORE = {{BEFORE}}, AFTER = {{AFTER}}, BN = {{IS_BN}};
  var BAND_AFTER = {{BAND_AFTER_JSON}}, DELTA_TXT = {{DELTA_JSON}};
  var NEG = AFTER < BEFORE;
  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  var NS = "http://www.w3.org/2000/svg";
  var g = document.getElementById("segs"), gs = document.getElementById("sides");
  function digits(n) { n = String(n); return BN ? n.replace(/[0-9]/g, function (d) { return "০১২৩৪৫৬৭৮৯"[d]; }) : n; }
  function el(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  function style(status) {
    if (status === "correct" || status === "misconception") return { fill: "url(#fyCoral)", op: 1, stroke: "none", side: "#6E2B10" };
    if (status === "partial") return { fill: "url(#fyCoral)", op: 0.62, stroke: "none", side: "#4A2314" };
    return { fill: "url(#fyGlass)", op: 1, stroke: "#8A93A8", side: "#1A2033" };
  }
  var bodies = [], seams = [];
  SEG.forEach(function (s) {
    var st = style(s.before);
    var sd0 = el("path", { d: s.d, fill: st.side, transform: "translate(0,7)" }); gs.appendChild(sd0); s._side = sd0;
    var p = el("path", { d: s.d, fill: st.fill, "fill-opacity": st.op, stroke: st.stroke, "stroke-width": 1.5 });
    if (st.stroke !== "none") p.setAttribute("stroke-dasharray", "4 3");
    g.appendChild(p); bodies.push(p);
    if (s.before === "misconception") {
      g.appendChild(el("path", { d: s.crack, fill: "none", stroke: "#FF6B6B", "stroke-width": 2.2, "stroke-linecap": "round", "stroke-linejoin": "round" }));
    }
    var seam = null;
    if (s.retested && !NEG && s.afterPoints >= 1 && s.before !== "correct") {
      seam = el("path", { d: s.crack, fill: "none", stroke: "#F2CF72", "stroke-width": 2.6, "stroke-linecap": "round", filter: "url(#glow)" });
      g.appendChild(seam);
      var L = seam.getTotalLength();
      seam.style.strokeDasharray = L; seam.style.strokeDashoffset = L;
      seam._L = L; seam._target = s.afterPoints >= 2 ? 0 : L * 0.5;
    }
    seams.push(seam);
  });
  function finish() {
    SEG.forEach(function (s, i) {
      var st = style(s.retested ? s.after : s.before);
      bodies[i].setAttribute("fill", st.fill); bodies[i].setAttribute("fill-opacity", st.op); SEG[i]._side.setAttribute("fill", st.side);
      if (seams[i]) seams[i].style.strokeDashoffset = seams[i]._target;
    });
    document.getElementById("num").textContent = digits(AFTER);
    document.getElementById("band").textContent = BAND_AFTER;
    var chip = document.getElementById("chip"); chip.textContent = DELTA_TXT; if (NEG) chip.classList.add("neg"); chip.classList.add("show");
  }
  if (reduce) { finish(); return; }
  var t0 = performance.now();
  // seams draw one after another from 0.4s, 250ms apart
  var order = []; seams.forEach(function (s, i) { if (s) order.push(i); });
  order.forEach(function (i, k) {
    setTimeout(function () {
      var s = seams[i]; s.style.transition = "stroke-dashoffset 0.7s ease-out"; s.style.strokeDashoffset = s._target;
      var sd = SEG[i], st = style(sd.after);
      setTimeout(function () { bodies[i].style.transition = "fill .4s, fill-opacity .4s"; bodies[i].setAttribute("fill", st.fill); bodies[i].setAttribute("fill-opacity", st.op); sd._side.setAttribute("fill", st.side); }, 500);
    }, 400 + k * 250);
  });
  if (NEG) setTimeout(finish, 600);
  // number counts up 0.6s -> 2.0s
  setTimeout(function () {
    var start = performance.now(), dur = 1400;
    (function tick(now) {
      var p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 3);
      document.getElementById("num").textContent = digits(Math.round(BEFORE + (AFTER - BEFORE) * e));
      if (p < 1) requestAnimationFrame(tick);
    })(start);
  }, 600);
  setTimeout(function () { document.getElementById("band").textContent = BAND_AFTER; }, 2000);
  setTimeout(function () { var c = document.getElementById("chip"); c.textContent = DELTA_TXT; if (NEG) c.classList.add("neg"); c.classList.add("show"); }, 2000);
  if (!NEG) setTimeout(function () { document.getElementById("shim").classList.add("go"); }, 2400);
  setTimeout(finish, 2800);
})();
</script>
</body>
</html>
